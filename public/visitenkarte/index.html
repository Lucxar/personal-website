<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAF9F7">
    <meta name="robots" content="noindex, nofollow">
    <title>Luca Wiegand | Visitenkarte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #FAF9F7;
            --color-surface: #FFFFFF;
            --color-surface-alt: #F5F4F1;
            --color-text: #1C1B19;
            --color-text-secondary: #6E6D68;
            --color-accent: #0071E3;
            --color-accent-hover: #0077ED;
            --color-border-light: #E9E7E3;
            --shadow-md: 0 4px 6px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.06), 0 4px 10px rgba(0,0,0,0.04);
            --shadow-xl: 0 20px 40px rgba(0,0,0,0.08), 0 8px 16px rgba(0,0,0,0.04);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            font-weight: 400;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .card {
            width: 100%;
            max-width: 28rem;
            background: var(--color-surface);
            border-radius: 1.5rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            animation: fadeIn 0.5s var(--ease-out-expo);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card__banner {
            height: 5rem;
            background: linear-gradient(to right, var(--color-accent), #3B82F6);
        }
        .card__body {
            padding: 0 1.5rem 2rem;
            text-align: center;
        }

        /* AI-modified portrait disclosure — required by AI_CONTENT_REGISTER.md */
        .portrait-figure {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            width: 8rem;
            margin: -3.5rem auto 0;
        }
        .portrait-figure__frame {
            width: 7rem;
            height: 7rem;
            padding: 0.375rem;
            background: var(--color-surface);
            border-radius: 9999px;
            box-shadow: var(--shadow-lg);
        }
        .portrait-figure__frame img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 28%;
            border-radius: 9999px;
        }
        /* Deliberately quiet, but never below the AI Act's legibility floor:
           Art. 50(5) requires the disclosure to be clear, distinguishable and
           conformant with accessibility requirements. #5C5B57 on the chip is
           6.80:1 — above the 4.5:1 WCAG AA minimum the EU guidance points to.
           Do not lower the contrast or the font size any further. */
        .portrait-ai-disclosure {
            position: absolute;
            z-index: 1;
            bottom: 0.25rem;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            max-width: calc(100% - 0.5rem);
            margin: 0;
            padding: 0.1rem 0.3rem;
            background: rgba(255, 255, 255, 0.92);
            color: #5C5B57;
            border-radius: 3px;
            font-size: 0.625rem;
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: 0.01em;
            white-space: nowrap;
            pointer-events: none;
        }

        .name {
            margin: 1.25rem 0 0;
            font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }
        .role {
            margin: 0 0 0.25rem;
            color: var(--color-accent);
            font-weight: 500;
            font-size: 0.875rem;
            letter-spacing: 0.025em;
            text-transform: uppercase;
        }
        .org {
            margin: 0;
            color: var(--color-text-secondary);
            font-size: 0.875rem;
        }
        .divider {
            width: 3rem;
            height: 2px;
            margin: 1.5rem auto;
            background: var(--color-border-light);
            border-radius: 9999px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            transition: transform 150ms var(--ease-out-quart),
                        box-shadow 150ms var(--ease-out-quart),
                        background 150ms var(--ease-out-quart);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn:active { transform: translateY(0) scale(0.98); transition-duration: 100ms; }
        .btn svg { flex: none; width: 1.125rem; height: 1.125rem; }

        .btn--primary { background: var(--color-accent); color: #FFFFFF; }
        .btn--primary:hover { background: var(--color-accent-hover); }
        .btn--muted {
            background: var(--color-surface-alt);
            color: var(--color-text);
            border: 1px solid var(--color-border-light);
        }
        .btn--muted:hover { background: var(--color-border-light); }
        .btn--linkedin { background: #0077B5; color: #FFFFFF; }
        .btn--linkedin:hover { background: #006097; }
        .btn--github { background: var(--color-text); color: var(--color-surface); }
        .btn--github:hover { background: #33322F; }

        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--color-text-secondary);
        }
        .footer a {
            color: inherit;
            text-decoration: none;
            transition: color 150ms var(--ease-out-quart);
        }
        .footer a:hover { color: var(--color-accent); }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
            .btn:hover, .btn:active { transform: none; }
        }
    </style>
</head>
